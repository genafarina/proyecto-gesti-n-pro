name: CI

on:
  pull_request:
  push:
    branches:
      - "codex/**"

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build

  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Apply all migrations to a fresh local database
        run: supabase db start
      - name: Lint database functions and schema
        run: supabase db lint --local --fail-on error
